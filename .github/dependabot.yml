version: 2
updates:
  # Maintain GitHub Actions dependencies with pinned commit SHAs
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    open-pull-requests-limit: 10

  # Maintain Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 10

  # Maintain Dockerfile base images for cf-tunnel-sync
  - package-ecosystem: "docker"
    directory: "/cf-tunnel-sync"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 5

  # Maintain Dockerfile base images for cf-tunnel-dashboard
  - package-ecosystem: "docker"
    directory: "/cf-tunnel-dashboard"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 5
