version: 2
updates:
  # Maintain GitHub Actions dependencies with pinned commit SHAs
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain Python dependencies and uv.lock using native uv ecosystem
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Maintain Dockerfile base images for cf-tunnel-sync
  - package-ecosystem: "docker"
    directory: "/cf-tunnel-sync"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      docker-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Maintain Dockerfile base images for cf-tunnel-dashboard
  - package-ecosystem: "docker"
    directory: "/cf-tunnel-dashboard"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      docker-dependencies:
        patterns:
          - "*"
