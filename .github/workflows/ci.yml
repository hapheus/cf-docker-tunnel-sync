name: CI Test & Smoke Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  unit-tests:
    name: Unit Tests (Hermetic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Lint with Ruff
        run: |
          uv run ruff check

      - name: Run Hermetic Unit Tests
        run: |
          uv run pytest -v

  smoke-tests:
    name: Container Build & Smoke Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Inspect Secrets Availability
        run: |
          echo "DOCKERHUB_USERNAME is: ${{ secrets.DOCKERHUB_USERNAME != '' && 'Set' || 'Not set' }}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build cf-tunnel-sync Image
        run: |
          success=0
          for i in 1 2 3; do
            if docker build -t cf-tunnel-sync:test ./cf-tunnel-sync; then
              success=1
              break
            fi
            echo "Retry $i failed, waiting..."
            sleep 2
          done
          if [ "$success" -ne 1 ]; then
            echo "Failed to build cf-tunnel-sync after 3 attempts"
            exit 1
          fi

      - name: Build cf-tunnel-dashboard Image
        run: |
          success=0
          for i in 1 2 3; do
            if docker build -t cf-tunnel-dashboard:test ./cf-tunnel-dashboard; then
              success=1
              break
            fi
            echo "Retry $i failed, waiting..."
            sleep 2
          done
          if [ "$success" -ne 1 ]; then
            echo "Failed to build cf-tunnel-dashboard after 3 attempts"
            exit 1
          fi

      - name: Test cf-tunnel-sync Container Boot & Health
        run: |
          mkdir -p /tmp/cloudflared-token
          docker run -d \
            --name test-cf-sync \
            -p 8090:8090 \
            -v /tmp/cloudflared-token:/etc/cloudflared \
            cf-tunnel-sync:test

          echo "Waiting for cf-tunnel-sync to boot..."
          RETRY=0
          until curl -s -f http://127.0.0.1:8090/health; do
            RETRY=$((RETRY+1))
            if [ "$RETRY" -ge 15 ]; then
              echo "Timeout waiting for cf-tunnel-sync"
              docker logs test-cf-sync
              exit 1
            fi
            sleep 2
          done
          echo "✅ cf-tunnel-sync booted and /health returned OK"

          echo "Verifying embedded Web Dashboard UI is served..."
          DASHBOARD_HTML=$(curl -s -f http://127.0.0.1:8090/)
          if echo "$DASHBOARD_HTML" | grep -q "Cloudflare Tunnel"; then
            echo "✅ Embedded Web Dashboard verified successfully"
          else
            echo "❌ Dashboard HTML did not contain expected content"
            exit 1
          fi

          echo "Stopping cf-tunnel-sync container cleanly..."
          docker stop -t 5 test-cf-sync
          EXIT_CODE=$(docker inspect test-cf-sync --format='{{.State.ExitCode}}')
          echo "Exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 143 ]; then
            echo "❌ Non-graceful exit code: $EXIT_CODE"
            exit 1
          fi
          docker rm test-cf-sync
          echo "✅ cf-tunnel-sync exited cleanly"

      - name: Test cf-tunnel-dashboard Container Boot & Health
        run: |
          docker run -d \
            --name test-cf-dashboard \
            -p 8080:80 \
            --add-host cf-tunnel-sync:127.0.0.1 \
            -e DASHBOARD_AUTH_ENABLED=true \
            -e BASIC_AUTH_USERNAME=admin \
            -e BASIC_AUTH_PASSWORD=testpassword123 \
            cf-tunnel-dashboard:test

          echo "Waiting for cf-tunnel-dashboard to boot..."
          RETRY=0
          until curl -s -f http://127.0.0.1:8080/health; do
            RETRY=$((RETRY+1))
            if [ "$RETRY" -ge 10 ]; then
              echo "Timeout waiting for cf-tunnel-dashboard"
              docker logs test-cf-dashboard
              exit 1
            fi
            sleep 1
          done
          echo "✅ cf-tunnel-dashboard booted and /health returned 200 OK"

          echo "Testing unauthenticated request (expecting 401)..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/)
          if [ "$HTTP_CODE" -ne 401 ]; then
            echo "❌ Expected 401 Unauthorized without credentials, got $HTTP_CODE"
            docker logs test-cf-dashboard
            exit 1
          fi
          echo "✅ Unauthenticated request correctly rejected with 401"

          echo "Testing authenticated request (expecting 200)..."
          AUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u admin:testpassword123 http://127.0.0.1:8080/)
          if [ "$AUTH_CODE" -ne 200 ]; then
            echo "❌ Expected 200 OK with valid credentials, got $AUTH_CODE"
            docker logs test-cf-dashboard
            exit 1
          fi
          echo "✅ Authenticated request succeeded with 200 OK"

          docker stop test-cf-dashboard
          docker rm test-cf-dashboard
          echo "✅ Dashboard smoke test completed successfully"
