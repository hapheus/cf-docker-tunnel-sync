name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions: read-all

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      matrix:
        include:
          - service: cf-tunnel-sync
            context: ./cf-tunnel-sync
            file: ./cf-tunnel-sync/Dockerfile
            readme: ./cf-tunnel-sync/DOCKERHUB.md
            short_desc: "Automated route and DNS synchronization between Docker containers and Cloudflare Tunnels"
          - service: cf-tunnel-dashboard
            context: ./cf-tunnel-dashboard
            file: ./cf-tunnel-dashboard/Dockerfile
            readme: ./cf-tunnel-dashboard/DOCKERHUB.md
            short_desc: "Web management dashboard for cf-docker-tunnel-sync"
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check Secrets Presence
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::DOCKERHUB_USERNAME secret is empty or missing!"
          else
            echo "DOCKERHUB_USERNAME secret is populated."
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_TOKEN secret is empty or missing!"
          else
            echo "DOCKERHUB_TOKEN secret is populated."
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Sign published Docker image with Cosign
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
        run: |
          echo "Signing container digest: ${IMAGE_REPO}@${DIGEST}"
          cosign sign --yes "${IMAGE_REPO}@${DIGEST}"

      - name: Update Docker Hub Description
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@e98e4d1628a5f3be2be7c231e50981aee98723ae # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          readme-filepath: ${{ matrix.readme }}
          short-description: ${{ matrix.short_desc }}
