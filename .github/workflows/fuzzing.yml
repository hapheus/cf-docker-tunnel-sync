name: Continuous Fuzz Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly fuzz campaign
    - cron: '0 2 * * 0'

permissions: read-all

jobs:
  fuzz:
    name: Fuzz Label Parser & Ingress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Run Property & Fuzz Tests
        run: |
          uv run pytest cf-tunnel-sync/test_fuzz_label_parser.py -v

      - name: Run Standalone Fuzz Harness
        run: |
          uv run python cf-tunnel-sync/fuzz_label_parser.py
