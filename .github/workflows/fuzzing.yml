name: Continuous Fuzz Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly fuzz campaign
    - cron: '0 2 * * 0'

permissions: read-all

jobs:
  fuzz:
    name: Fuzz Label Parser & Ingress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Run Property & Fuzz Tests
        run: |
          uv run pytest tests/property/test_fuzz_label_parser.py -v

      - name: Run Standalone Fuzz Harness
        run: |
          uv run python scripts/fuzz_label_parser.py
