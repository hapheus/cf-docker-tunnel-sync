name: Continuous Fuzz Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly fuzz campaign
    - cron: '0 2 * * 0'

permissions: read-all

jobs:
  fuzz:
    name: Fuzz Label Parser & Ingress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Run Property & Fuzz Tests
        run: |
          uv run pytest cf-tunnel-sync/test_fuzz_label_parser.py -v

      - name: Run Standalone Fuzz Harness
        run: |
          uv run python cf-tunnel-sync/fuzz_label_parser.py
