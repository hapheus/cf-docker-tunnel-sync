server {
    listen 80;
    server_name localhost;

    # Written by the entrypoint according to DASHBOARD_AUTH_ENABLED.
    include /etc/nginx/snippets/dashboard-auth.conf;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Upstream proxy configuration generated dynamically by entrypoint.sh (supports SYNC_BACKEND_HOST and SYNC_BACKEND_PORT)
    include /etc/nginx/snippets/sync-backend.conf;



    location /health {
        auth_basic off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }
}
