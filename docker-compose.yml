  #   restart: always
  #   environment:
  #     - DASHBOARD_AUTH_ENABLED=${DASHBOARD_AUTH_ENABLED:-true}
  #     - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME}
  #     - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD}
  #   ports:
  #     - "${DASHBOARD_BIND_ADDRESS:-0.0.0.0}:8081:80"
  #   networks:
  #     - cf-tunnel-net
  #   depends_on:
  #     cf-tunnel-sync:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 2s

  # Example Service (uncomment to test)
  # web-example:
  #   image: nginx:alpine
