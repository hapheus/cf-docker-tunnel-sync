services:
  # Internal Database (isolated, never exposed to tunnel)
  db:
    image: postgres:16-alpine
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal-backend

  # Web Application (connects to internal database AND external gateway network)
  web:
    image: traefik/whoami:latest
    container_name: my-app-web
    restart: unless-stopped
    depends_on:
      - db
    labels:
      - "cf.tunnel.enable=true"
      - "cf.tunnel.hostname=app.${DOMAIN_NAME}"
      - "cf.tunnel.port=80"
    networks:
      - internal-backend
      - cf-tunnel-net

networks:
  # Private network for database and web backend
  internal-backend:
    driver: bridge

  # Shared external network connected to cloudflared
  cf-tunnel-net:
    name: cf-tunnel-net
    external: true

volumes:
  db_data:
