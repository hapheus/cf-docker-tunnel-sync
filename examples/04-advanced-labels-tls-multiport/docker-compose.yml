services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /etc/cloudflared/token
    volumes:
      - cf_token_data:/etc/cloudflared:ro
    networks:
      - cf-tunnel-net
    depends_on:
      cf-tunnel-sync:
        condition: service_healthy
  cf-tunnel-sync:
    image: hapheus/cf-tunnel-sync:latest
    container_name: cf-tunnel-sync
    restart: unless-stopped
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - CLOUDFLARE_TUNNEL_NAME=${CLOUDFLARE_TUNNEL_NAME:-advanced-labels-tunnel}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CF_NETWORK_NAME=${CF_NETWORK_NAME:-cf-tunnel-net}
      - CLOUDFLARED_CONTAINER_NAME=cloudflared
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - cf_token_data:/etc/cloudflared
    networks:
      - cf-tunnel-net
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /etc/cloudflared/token && python healthcheck.py
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2s
  app-selfsigned-https:
    image: traefik/whoami:latest
    container_name: app-selfsigned-https
    restart: unless-stopped
    labels:
      - cf.tunnel.hostname=tls-app.${DOMAIN_NAME}
      - cf.tunnel.service=https://app-selfsigned-https:8443
      - cf.tunnel.originRequest.noTLSVerify=true
    networks:
      - cf-tunnel-net
    command:
      - --port=8443
      - --cert=/certs/origin.crt
      - --key=/certs/origin.key
    volumes:
      - ./certs:/certs:ro
  app-custom-headers:
    image: traefik/whoami:latest
    container_name: app-custom-headers
    restart: unless-stopped
    labels:
      - cf.tunnel.hostname=cloud.${DOMAIN_NAME}
      - cf.tunnel.port=8443
      - cf.tunnel.httpHostHeader=cloud.${DOMAIN_NAME}
      - cf.tunnel.originServerName=origin.internal
      - cf.tunnel.protocol=https
      - cf.tunnel.originRequest.noTLSVerify=true
    networks:
      - cf-tunnel-net
    command:
      - --port=8443
      - --cert=/certs/origin.crt
      - --key=/certs/origin.key
    volumes:
      - ./certs:/certs:ro
  app-multi-port:
    image: nginx:alpine
    container_name: app-multi-port
    restart: unless-stopped
    labels:
      - cf.tunnel.hostname=multiport.${DOMAIN_NAME}
      - cf.tunnel.port=8080
    networks:
      - cf-tunnel-net
    volumes:
      - ./multiport.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - '80'
      - '8080'
networks:
  cf-tunnel-net:
    name: ${CF_NETWORK_NAME:-cf-tunnel-net}
    driver: bridge
volumes:
  cf_token_data: {}
