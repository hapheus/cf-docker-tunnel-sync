[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-docker-tunnel-sync"
version = "1.20.7"
description = "Automated Cloudflare Zero Trust Tunnel & DNS synchronization for Docker containers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Franz Haberfellner", email = "hapheus@users.noreply.github.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["app", "cloudflare", "config", "diagnostics", "healthcheck", "metrics", "models", "notifications", "reconcile", "resilience", "security"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tunnel_sync*"]

[tool.setuptools.package-data]
tunnel_sync = ["web/static/*.html"]

[project.scripts]
cf-docker-tunnel-sync = "tunnel_sync.runtime.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
    "respx>=0.21.0",
    "pyyaml>=6.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/test_*.py" = ["E402"]
"test_*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
]
